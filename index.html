<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloud Computing Quiz</title>
  <style>
    :root{--bg:#f6f8fb;--card:#ffffff;--accent:#0b5cff;--muted:#6b7280;}
    body{font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);margin:0;padding:24px;color:#0b1220}
    .container{max-width:960px;margin:0 auto}
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    h1{margin:0;font-size:20px}
    p.lead{margin:4px 0 20px;color:var(--muted)}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 18px rgba(12,24,48,0.06);padding:18px}
    .q{padding:12px;border-radius:8px;margin-bottom:10px;border:1px solid #eef2ff}
    .q h3{margin:0 0 8px;font-size:15px}
    .opts{display:flex;flex-direction:column;gap:6px}
    label.opt{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
    input[type=radio]{width:16px;height:16px}
    .result{margin-top:14px;padding:12px;border-radius:8px;background:#f3f7ff;border:1px solid #dbe8ff}
    .correct{background:#e6ffef;border-color:#b9f2d0}
    .wrong{background:#fff0f0;border-color:#ffd2d2}
    .score{font-weight:700;font-size:18px}
    .controls{display:flex;gap:8px;align-items:center;margin-top:14px}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
    button.secondary{background:#f3f4f6;color:#0b1220}
    .feedback{margin-top:12px}
    small.hint{color:var(--muted)}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
    @media (max-width:640px){body{padding:12px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Cloud Computing Quiz</h1>
        <p class="lead">Answer all questions then press <strong>Submit</strong></p>
      </div>
    </header>

    <div class="card" id="quizCard">
      <div id="quiz"></div>

      <div class="controls">
        <button id="submitBtn">Submit</button>
        <button id="resetBtn" class="secondary" type="button">Reset</button>
        <button id="shuffleBtn" class="secondary" type="button">Shuffle Questions</button>
      </div>

      <div id="summary" class="feedback"></div>
    </div>

    <footer>All rights reserved to khaled :P happy new year</footer>
  </div>

<script>
const questions = [

  {"q": "5. Which benefit that includes computing resources are pooled and provisioned in a multi- tenant model?", "opts": ["A) On-demand self-service", "B) Widespread network access", "C) Resource pooling", "D) Quick deployment and auto scaling"], "ans": "C"},
  {"q": "6. Which of the following is NOT considered as Challenges to Traditional IT?", "opts": ["A) Complex lifecycle management", "B) Low reliability", "C) Low TCO", "D) Latency caused by I/O bottlenecks"], "ans": "C"},

  {"q": "11. Which cloud model allows the user to focus mainly on the application that being provided?", "opts": ["A) SaaS", "B) PaaS", "C) IaaS", "D) Traditional IT"], "ans": "A"},

  {"q": "14. Cloud infrastructure is owned and managed by a third-party cloud service provider and shared with multiple organizations using the Internet.", "opts": ["A) Public cloud", "B) Private cloud", "C) Hybrid cloud", "D) None of the above"], "ans": "A", "fixed": true},
  {"q": "15. One key benefit of using hybrid cloud solutions is:", "opts": ["A) Reduced dependency on public cloud resources", "B) The ability to seamlessly integrate on-premises IT infrastructure with public cloud services", "C) High dependency on a single vendor’s infrastructure", "D) Lack of data synchronization between on-premises and cloud resources"], "ans": "B"},
  {"q": "16. Which of the following considered as Amazon cloud resource?", "opts": ["A) AWS", "B) Azure", "C) VMware", "D) Google Cloud"], "ans": "A"},
  {"q": "17. Which of the following that acts between a client and a destination server, forwarding requests and responses?", "opts": ["A) Database", "B) Email", "C) Routing", "D) Proxy"], "ans": "D"},
  {"q": "18. Which of the following servers is similar to a vertical PC in size?", "opts": ["A) Tower Servers", "B) Rack Servers", "C) Blade Servers", "D) None of the above"], "ans": "A", "fixed": true},
  {"q": "19. Which of the following servers is Ideal for high-performance or dense computing?", "opts": ["A) Tower Servers", "B) Rack Servers", "C) Blade Servers", "D) None of the above"], "ans": "C", "fixed": true},
  {"q": "20. Which of the following servers provide moderate server scalability?", "opts": ["A) Tower Servers", "B) Rack Servers", "C) Blade Servers", "D) None of the above"], "ans": "B", "fixed": true},
  {"q": "21. Which of the below computer components is the primary component of a computer that executes instructions, processes data?", "opts": ["A) Memory", "B) Drive", "C) CPU", "D) NIC"], "ans": "C"},
  {"q": "22. Which of the below computer components is used to temporarily store CPU operation data?", "opts": ["A) Memory", "B) Drive", "C) CPU", "D) NIC"], "ans": "A"},
  {"q": "23. Which of the below is considered the fastest storage disk and the most expensive?", "opts": ["A) SATA", "B) SAS", "C) NL-SAS", "D) SSD"], "ans": "D"},

function renderQuiz(){

    qDiv.id = 'q'+(idx+1);
    const h = document.createElement('h3');
    const questionText = item.q.replace(/^\d+\.\s*/, '');
    h.textContent = (idx + 1) + '. ' + questionText;
    qDiv.appendChild(h);

    const optsDiv = document.createElement('div');
    optsDiv.className = 'opts';

    item.opts.forEach((opt, j)=>{
      const label = document.createElement('label');
      label.className = 'opt';
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'q'+idx;
      radio.value = String.fromCharCode(65+j);
      const span = document.createElement('span');
      const cleanOpt = opt.replace(/^[A-D]\)\s*/, '');
      span.textContent = String.fromCharCode(65+j) + ') ' + cleanOpt;
      label.appendChild(radio);
      label.appendChild(span);
      optsDiv.appendChild(label);
    });

    qDiv.appendChild(optsDiv);
    quizDiv.appendChild(qDiv);
  });
}

function grade(){
  let correct=0;
  currentQuestions.forEach((item, idx)=>{
    const selected = document.querySelector('input[name="q'+idx+'"]:checked');
    const qElem = document.getElementById('q'+(idx+1));
    qElem.classList.remove('correct','wrong');
    qElem.querySelectorAll('.opt').forEach(l=>{l.style.opacity='1';});
    if(selected){
      const val = selected.value;
      if(val === item.ans){
        correct++;
        qElem.classList.add('correct');
      } else {
        qElem.classList.add('wrong');
        qElem.querySelectorAll('.opt').forEach(l=>{if(l.querySelector('input').checked) l.style.fontWeight='700';});
      }
    } else {
      qElem.classList.add('wrong');
    }
    let ansText = document.createElement('div');
    ansText.style.marginTop='8px';
    ansText.style.fontSize='13px';
    ansText.style.color='#0b1220';
    ansText.innerHTML = '<small><strong>Correct answer: </strong>' + item.ans + '</small>';
    const old = qElem.querySelector('.correctAnswer');
    if(old) old.remove();
    ansText.className='correctAnswer';
    qElem.appendChild(ansText);
  });

  const total = currentQuestions.length;
  const percent = Math.round((correct/total)*100);
  const gradeLetter = percent>=90? 'A' : percent>=80? 'B' : percent>=70? 'C' : percent>=60? 'D' : 'F';

  const summary = document.getElementById('summary');
  summary.innerHTML = '<div class="result"><div class="score">Score: '+correct+' / '+total+' ('+percent+'%) — Grade: '+gradeLetter+'</div>'+
                      '<div style="margin-top:8px"><small>Correct: '+correct+' — Wrong/Unanswered: '+(total-correct)+'</small></div></div>';
  summary.scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
  document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
  document.querySelectorAll('.q').forEach(q=>{
    q.classList.remove('correct','wrong');
    const ca = q.querySelector('.correctAnswer'); if(ca) ca.remove();
    q.querySelectorAll('.opt').forEach(l=>{l.style.fontWeight='400';l.style.opacity='1'});
  });
  document.getElementById('summary').innerHTML='';
}

function shuffleQuestions(){
  resetQuiz();
  currentQuestions = [...questions];
  for(let i = currentQuestions.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
  }

  currentQuestions = currentQuestions.map(q => {
    if (q.opts.length === 2 && q.opts[0].includes('True') && q.opts[1].includes('False')) {
      return q;
    }
    if (q.fixed === true) {
      return q;
    }
    const newQ = {...q};

    const optionsWithLetters = newQ.opts.map((opt, idx) => ({
      text: opt,
      originalLetter: String.fromCharCode(65 + idx)
    }));

    for (let i = optionsWithLetters.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [optionsWithLetters[i], optionsWithLetters[j]] = [optionsWithLetters[j], optionsWithLetters[i]];
    }

    newQ.opts = optionsWithLetters.map(item => item.text);

    const correctAnswerIndex = optionsWithLetters.findIndex(
      item => item.originalLetter === newQ.ans
    );
    newQ.ans = String.fromCharCode(65 + correctAnswerIndex);

    return newQ;
  });

  renderQuiz();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

renderQuiz();

document.getElementById('submitBtn').addEventListener('click', grade);
document.getElementById('resetBtn').addEventListener('click', resetQuiz);
document.getElementById('shuffleBtn').addEventListener('click', shuffleQuestions);

</script>
